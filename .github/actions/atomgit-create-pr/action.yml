name: 'AtomGit Create Pull Request'
description: '在 AtomGit 仓库上提交变更并创建 PR'

inputs:
  owner:
    description: 'AtomGit 仓库 owner'
    required: true
  repo:
    description: 'AtomGit 仓库名'
    required: true
  branch:
    description: '新分支名(基于 base 创建)'
    required: true
  base:
    description: '目标分支(默认 master)'
    required: false
    default: 'master'
  title:
    description: 'PR 标题'
    required: true
  body:
    description: 'PR 正文(Markdown)'
    required: false
    default: ''
  commit_message:
    description: '提交信息(默认同 title)'
    required: false
    default: ''
  work_dir:
    description: '本地仓库工作目录(必须已 clone 并切到 base 分支)'
    required: true
  atomgit_token:
    description: 'AtomGit token'
    required: true
  git_user_name:
    description: 'commit 作者名'
    required: false
    default: 'geo-develop-bot'
  git_user_email:
    description: 'commit 作者邮箱'
    required: false
    default: 'geo-develop-bot@noreply.local'

outputs:
  pr_url:
    description: '创建的 PR URL'
    value: ${{ steps.run.outputs.pr_url }}
  pr_number:
    description: 'PR 编号'
    value: ${{ steps.run.outputs.pr_number }}
  has_changes:
    description: '是否有改动'
    value: ${{ steps.run.outputs.has_changes }}

runs:
  using: 'composite'
  steps:
    - id: run
      shell: bash
      env:
        INPUT_OWNER: ${{ inputs.owner }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_BODY: ${{ inputs.body }}
        INPUT_COMMIT_MESSAGE: ${{ inputs.commit_message }}
        INPUT_WORK_DIR: ${{ inputs.work_dir }}
        INPUT_GIT_USER_NAME: ${{ inputs.git_user_name }}
        INPUT_GIT_USER_EMAIL: ${{ inputs.git_user_email }}
        ATOMGIT_TOKEN: ${{ inputs.atomgit_token }}
      run: node "$GITHUB_ACTION_PATH/index.js"
