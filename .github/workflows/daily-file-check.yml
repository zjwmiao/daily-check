name: Daily File Check

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      repo:
        description: '仓库 URL (支持多个，逗号分隔，如 https://atomgit.com/owner/repo.git 或 owner/repo)'
        required: false
        default: ''
      branch:
        description: '分支'
        required: false
        default: ''
      since:
        description: '时间范围 (如 "2 days ago")'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (仅检查，不生成配置)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  DEFAULT_REPO: ${{ vars.DAILY_CHECK_REPO || 'https://atomgit.com/example/repo.git' }}
  DEFAULT_BRANCH: ${{ vars.DAILY_CHECK_BRANCH || 'main' }}
  OPENCODE_MODEL: ${{ vars.AI_MODEL || 'alibaba-cn/glm-5' }}
  OPENCODE_AGENT: ${{ vars.AI_AGENT || 'build' }}
  OPENCODE_EXTRA_ARGS: ${{ vars.AI_EXTRA_ARGS || '--dangerously-skip-permissions' }}

jobs:
  check:
    runs-on: portal-x86
    timeout-minutes: 90
    steps:
      - name: Checkout geo-develop
        uses: actions/checkout@v4

      - name: Install deps
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Verify opencode
        shell: bash
        timeout-minutes: 2
        run: |
          echo "=== opencode 环境 ==="
          which opencode
          opencode --version

      - name: Check new pages
        shell: bash
        env:
          REPO: ${{ inputs.repo || env.DEFAULT_REPO }}
          BRANCH: ${{ inputs.branch || env.DEFAULT_BRANCH }}
          SINCE: ${{ inputs.since || '' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        run: |
          DRY_RUN_ARG=""
          
          if [ "$DRY_RUN" = "true" ]; then
            DRY_RUN_ARG="--dryRun"
          fi
          
          node scripts/geo-daily-check/check-batch.js \
            --repo="$REPO" \
            --branch="$BRANCH" \
            ${SINCE:+--since="$SINCE"} \
            $DRY_RUN_ARG