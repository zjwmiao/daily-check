name: GEO Bot

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  analyze:
    if: |
      !github.event.issue.pull_request &&
      startsWith(github.event.issue.title, '[GEO优化]') &&
      startsWith(github.event.comment.body, '/analyze')
    runs-on: portal-x86
    concurrency:
      group: geo-bot-analyze-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout geo-develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install deps
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Parse target from issue title
        id: parse
        shell: bash
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          if [[ "$ISSUE_TITLE" =~ \[GEO优化\]#([0-9]+) ]]; then
            echo "target=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            echo "target=all" >> $GITHUB_OUTPUT
          fi
          echo "run_dir=geo-runs/${{ github.event.issue.number }}/$(date -u +%Y%m%dT%H%M%SZ)" >> $GITHUB_OUTPUT

      - name: Ack on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -d "$(jq -nc --arg b "🔍 开始分析 target=\`${{ steps.parse.outputs.target }}\` (run: ${{ steps.parse.outputs.run_dir }})..." '{body:$b}')"

      - name: Fetch geo-workflow candidates
        env:
          # geo-workflow 是 private 仓,内置 secrets.GITHUB_TOKEN 无权读取
          # 需要在仓库 secrets 配置 GEO_GITHUB_TOKEN (拥有 geo-workflow 读权限的 PAT)
          GITHUB_TOKEN: ${{ secrets.GEO_GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "❌ secret GEO_GITHUB_TOKEN 未配置 — geo-workflow 是 private 仓,需 PAT 读取"
            exit 1
          fi
          mkdir -p "${{ steps.parse.outputs.run_dir }}"
          node scripts/fetch-geo-issues.js \
            --issue=${{ steps.parse.outputs.target }} \
            --output=${{ steps.parse.outputs.run_dir }}/candidates.json

      - name: Run analysis
        shell: bash
        run: |
          node scripts/run-analysis.js \
            --input=${{ steps.parse.outputs.run_dir }}/candidates.json \
            --output=${{ steps.parse.outputs.run_dir }}/analysis.json \
            ${{ vars.GEO_SKIP_BROWSER == 'true' && '--skip-browser' || '' }}

      - name: Generate report
        shell: bash
        run: |
          node scripts/generate-report.js \
            --input=${{ steps.parse.outputs.run_dir }}/analysis.json \
            --output=${{ steps.parse.outputs.run_dir }}/report.md \
            --trigger-issue=${{ github.event.issue.number }}

      - name: Commit analysis artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: geo-develop-bot
          GIT_AUTHOR_EMAIL: geo-develop-bot@noreply.local
          GIT_COMMITTER_NAME: geo-develop-bot
          GIT_COMMITTER_EMAIL: geo-develop-bot@noreply.local
        run: |
          git add geo-runs/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore(geo-runs): analyze #${{ github.event.issue.number }} target=${{ steps.parse.outputs.target }}"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      - name: Comment report on trigger issue
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT_PATH="${{ steps.parse.outputs.run_dir }}/report.md"
          jq -Rsc --arg path "$REPORT_PATH" '{body: .}' < "$REPORT_PATH" > /tmp/comment.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            --data @/tmp/comment.json > /dev/null

      - name: Open portal issues
        shell: bash
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        run: |
          node scripts/open-portal-issues.js \
            --input=${{ steps.parse.outputs.run_dir }}/analysis.json \
            --trigger-repo=${{ github.repository }} \
            --trigger-issue=${{ github.event.issue.number }} \
            --run-dir=${{ steps.parse.outputs.run_dir }} \
            --output=${{ steps.parse.outputs.run_dir }}/portal-issues.json

      - name: Commit portal-issues record
        shell: bash
        run: |
          if [ -f "${{ steps.parse.outputs.run_dir }}/portal-issues.json" ]; then
            git add ${{ steps.parse.outputs.run_dir }}/portal-issues.json
            git diff --cached --quiet || git commit -m "chore(geo-runs): record portal issues for #${{ github.event.issue.number }}"
            git push origin HEAD:${{ github.event.repository.default_branch }} || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: geo-analysis-${{ github.event.issue.number }}-${{ github.run_id }}
          path: ${{ steps.parse.outputs.run_dir }}/
          retention-days: 90

      - name: Comment failure summary
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -d "$(jq -nc --arg url "$RUN_URL" '{body: "❌ `/analyze` 失败,详见 \($url)"}')"

  fix:
    if: |
      !github.event.issue.pull_request &&
      startsWith(github.event.issue.title, '[GEO优化]') &&
      startsWith(github.event.comment.body, '/fix')
    runs-on: portal-x86
    concurrency:
      group: geo-bot-fix-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout geo-develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install deps
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Prepare run dir
        id: prepare
        shell: bash
        run: |
          RUN_DIR="geo-runs/${{ github.event.issue.number }}/fix-$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "$RUN_DIR"
          echo "run_dir=$RUN_DIR" >> $GITHUB_OUTPUT

      - name: Fetch fix payload from issue comments
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/fetch-fix-payload.js \
            --repo=${{ github.repository }} \
            --issue=${{ github.event.issue.number }} \
            --output=${{ steps.prepare.outputs.run_dir }}/fix-payload.json

      - name: Ack on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -d "$(jq -nc --arg b "🛠 开始修复 (payload: \`${{ steps.prepare.outputs.run_dir }}/fix-payload.json\`)..." '{body:$b}')"

      - name: Execute fix runs
        shell: bash
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_REPO: ${{ github.repository }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
          RUN_DIR: ${{ steps.prepare.outputs.run_dir }}
          AGENT_FILE: ${{ github.workspace }}/.github/agents/geo-fix-prompt.md
        run: |
          node scripts/execute-fix-runs.js \
            --payload=${{ steps.prepare.outputs.run_dir }}/fix-payload.json \
            --output=${{ steps.prepare.outputs.run_dir }}/fix-results.json

      - name: Commit fix artifacts
        shell: bash
        env:
          GIT_AUTHOR_NAME: geo-develop-bot
          GIT_AUTHOR_EMAIL: geo-develop-bot@noreply.local
          GIT_COMMITTER_NAME: geo-develop-bot
          GIT_COMMITTER_EMAIL: geo-develop-bot@noreply.local
        run: |
          git add ${{ steps.prepare.outputs.run_dir }}/
          git diff --cached --quiet || git commit -m "chore(geo-runs): fix results for #${{ github.event.issue.number }}"
          git push origin HEAD:${{ github.event.repository.default_branch }} || true

      - name: Comment fix summary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/comment-fix-summary.js \
            --results=${{ steps.prepare.outputs.run_dir }}/fix-results.json \
            --trigger-repo=${{ github.repository }} \
            --trigger-issue=${{ github.event.issue.number }}

      - name: Comment failure summary
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -d "$(jq -nc --arg url "$RUN_URL" '{body: "❌ `/fix` 失败,详见 \($url)"}')"
