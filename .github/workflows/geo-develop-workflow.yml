name: GEO Develop Workflow

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

# 整 workflow 默认配置(可被 repo variables 覆盖)
env:
  AI_MODEL: ${{ vars.AI_MODEL || 'alibaba-cn/glm-5' }}
  AI_AGENT: ${{ vars.AI_AGENT || 'build' }}
  # 关键:CI 无 TTY,opencode build agent 任何读写都会触发交互确认 → 永久 hang
  # 必须 --dangerously-skip-permissions 跳过(同 openEuler-portal-mirror 仓约定)
  AI_EXTRA_ARGS: ${{ vars.AI_EXTRA_ARGS || '--dangerously-skip-permissions' }}

jobs:
  analyze:
    if: |
      !github.event.issue.pull_request &&
      startsWith(github.event.issue.title, '[GEO优化]') &&
      startsWith(github.event.comment.body, '/analyze')
    runs-on: portal-x86
    timeout-minutes: 15
    concurrency:
      group: geo-develop-workflow-analyze-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout geo-develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install deps
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Parse target from issue title
        id: parse
        shell: bash
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          if [[ "$ISSUE_TITLE" =~ \[GEO优化\]#([0-9]+) ]]; then
            echo "target=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            echo "target=all" >> $GITHUB_OUTPUT
          fi
          # 中间文件丢到 runner 临时区,workflow 结束自动清理(审计走 issue 评论,ADR-0015 + Round 17)
          echo "run_dir=${RUNNER_TEMP}/geo-analyze-${{ github.event.issue.number }}-$(date -u +%Y%m%dT%H%M%SZ)" >> $GITHUB_OUTPUT

      - name: Ack on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -d "$(jq -nc --arg b "🔍 开始分析 target=\`${{ steps.parse.outputs.target }}\` ..." '{body:$b}')"

      - name: Fetch geo-workflow candidates
        env:
          # geo-workflow 是 private 仓,内置 secrets.GITHUB_TOKEN 无权读取
          # 需要在仓库 secrets 配置 GEO_GITHUB_TOKEN (拥有 geo-workflow 读权限的 PAT)
          GITHUB_TOKEN: ${{ secrets.GEO_GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "❌ secret GEO_GITHUB_TOKEN 未配置 — geo-workflow 是 private 仓,需 PAT 读取"
            exit 1
          fi
          mkdir -p "${{ steps.parse.outputs.run_dir }}"
          node scripts/fetch-geo-issues.js \
            --issue=${{ steps.parse.outputs.target }} \
            --output=${{ steps.parse.outputs.run_dir }}/candidates.json

      - name: Run analysis
        shell: bash
        run: |
          node scripts/run-analysis.js \
            --input=${{ steps.parse.outputs.run_dir }}/candidates.json \
            --output=${{ steps.parse.outputs.run_dir }}/analysis.json \
            ${{ vars.GEO_SKIP_BROWSER == 'true' && '--skip-browser' || '' }}

      # 先开 portal issue,再生成报告 — 这样报告里的 fix-payload 能内嵌 portal_issue_url,
      # /fix 拿到 payload 就有 portal_issue_url,后续 createPR 才能在 PR body 里链上 portal issue
      - name: Open portal issues
        shell: bash
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        run: |
          node scripts/open-portal-issues.js \
            --input=${{ steps.parse.outputs.run_dir }}/analysis.json \
            --trigger-repo=${{ github.repository }} \
            --trigger-issue=${{ github.event.issue.number }} \
            --run-dir=${{ steps.parse.outputs.run_dir }} \
            --output=${{ steps.parse.outputs.run_dir }}/portal-issues.json

      - name: Generate report
        shell: bash
        run: |
          node scripts/generate-report.js \
            --input=${{ steps.parse.outputs.run_dir }}/analysis.json \
            --portal-issues=${{ steps.parse.outputs.run_dir }}/portal-issues.json \
            --output=${{ steps.parse.outputs.run_dir }}/report.md \
            --trigger-issue=${{ github.event.issue.number }}

      - name: Comment report on trigger issue
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT_PATH="${{ steps.parse.outputs.run_dir }}/report.md"
          jq -Rsc --arg path "$REPORT_PATH" '{body: .}' < "$REPORT_PATH" > /tmp/comment.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            --data @/tmp/comment.json > /dev/null

      - name: Comment failure summary
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -d "$(jq -nc --arg url "$RUN_URL" '{body: "❌ `/analyze` 失败,详见 \($url)"}')"

  fix:
    if: |
      !github.event.issue.pull_request &&
      startsWith(github.event.issue.title, '[GEO优化]') &&
      startsWith(github.event.comment.body, '/fix')
    runs-on: portal-x86
    timeout-minutes: 45
    concurrency:
      group: geo-develop-workflow-fix-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout geo-develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install deps
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Prepare run dir
        id: prepare
        shell: bash
        run: |
          # 中间文件丢到 runner 临时区(ADR-0015 + Round 17)
          RUN_DIR="${RUNNER_TEMP}/geo-fix-${{ github.event.issue.number }}-$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "$RUN_DIR"
          echo "run_dir=$RUN_DIR" >> $GITHUB_OUTPUT

      - name: Verify opencode (smoke test)
        shell: bash
        timeout-minutes: 2
        run: |
          echo "=== opencode 环境 ==="
          which opencode
          opencode --version
          echo ""
          echo "=== ping 测试(60s 内必须出 PONG)==="
          T0=$(date +%s)
          echo '你是测试模式。请只回复 "PONG收到",不要做任何其他事。' \
            | opencode run - \
                --model "${AI_MODEL:-alibaba-cn/glm-5}" \
                --agent "${AI_AGENT:-build}" \
                ${AI_EXTRA_ARGS:---dangerously-skip-permissions}
          echo "=== ping 耗时 $(($(date +%s)-T0))s ==="

      - name: Fetch fix payload from issue comments
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/fetch-fix-payload.js \
            --repo=${{ github.repository }} \
            --issue=${{ github.event.issue.number }} \
            --output=${{ steps.prepare.outputs.run_dir }}/fix-payload.json

      - name: Ack on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -d "$(jq -nc --arg b "🛠 开始修复 ..." '{body:$b}')"

      - name: Execute fix runs
        shell: bash
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_REPO: ${{ github.repository }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
          RUN_DIR: ${{ steps.prepare.outputs.run_dir }}
          AGENT_FILE: ${{ github.workspace }}/.github/agents/geo-fix-prompt.md
          # 反向审查 prompt — 设为空串关闭(整 run 时长会 -3~5min)
          CRITIC_AGENT_FILE: ${{ github.workspace }}/.github/agents/geo-critic-prompt.md
        run: |
          node scripts/execute-fix-runs.js \
            --payload=${{ steps.prepare.outputs.run_dir }}/fix-payload.json \
            --output=${{ steps.prepare.outputs.run_dir }}/fix-results.json

      - name: Comment fix summary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/comment-fix-summary.js \
            --results=${{ steps.prepare.outputs.run_dir }}/fix-results.json \
            --trigger-repo=${{ github.repository }} \
            --trigger-issue=${{ github.event.issue.number }}

      - name: Comment failure summary
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -d "$(jq -nc --arg url "$RUN_URL" '{body: "❌ `/fix` 失败,详见 \($url)"}')"
