name: GEO Poll

on:
  schedule:
    # 调试期暂改为每周一 05:17 UTC = 北京周一 13:17(避开高峰 + 极低频)
    # 调试完想要 sync+revalidate 4h 节奏的话,改回 '17 */4 * * *'
    - cron: '17 5 * * 1'
  workflow_dispatch:   # 调试期主要靠手工触发(Actions UI 或 gh workflow run)

permissions:
  contents: write
  issues: write

env:
  AI_MODEL: ${{ vars.AI_MODEL || 'alibaba-cn/glm-5' }}
  AI_AGENT: ${{ vars.AI_AGENT || 'build' }}
  AI_EXTRA_ARGS: ${{ vars.AI_EXTRA_ARGS || '--dangerously-skip-permissions' }}

jobs:
  poll:
    runs-on: portal-x86
    timeout-minutes: 30
    steps:
      - name: Checkout geo-develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install deps
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Sync new geo-workflow issues
        env:
          GEO_GITHUB_TOKEN: ${{ secrets.GEO_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/sync-geo-issues.js \
            --source-repo=opensourceways/geo-workflow \
            --target-repo=${{ github.repository }}

      - name: Watch portal PRs + revalidate + auto-close
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEO_GITHUB_TOKEN: ${{ secrets.GEO_GITHUB_TOKEN }}
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        run: |
          node scripts/poll-portal-status.js \
            --target-repo=${{ github.repository }}

      - name: Comment failure summary
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "❌ geo-poll 失败,详见 $RUN_URL"
