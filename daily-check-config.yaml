projects:
  - name: openEuler
    owner: openeuler
    repo: openEuler-portal
    repo_url: https://gitcode.com/openeuler/openEuler-portal.git
    branch: master
    framework: VitePress
    build_dir: app/.vitepress/dist
    accessible_routes:
      - /zh/**/*
      - /en/**/*
    ignore_routes:
      - /(zh|en)/(other/)?(blog|news|cookies|showcase|privacy|legal|data-sharing-with-third-parties|personal-data-collection-overview)
    build_script: build:geo
    seo_config_dir:
      tdk: .geo/tdks
      schema: .geo/jsonld
    home:
      - https://www.openeuler.org/
      - https://www.openeuler.openatom.cn/
  - name: openGauss
    owner: opengauss
    repo: website
    repo_url: https://gitcode.com/opengauss/website.git
    branch: v2
    framework: VitePress
    build_dir: app/.vitepress/dist
    accessible_routes:
      - /zh/**/*
      - /en/**/*
    ignore_routes:
      - /(zh|en)/(blogs|news|events|cookies|showcase|search|notification|summit|user-practice|privacy|legal|data-sharing-with-third-parties|personal-data-collection-overview)
    build_script: build
    seo_config_dir:
      tdk: .geo/tdk
      schema: .geo/jsonld
    home:
      - https://opengauss.org/
