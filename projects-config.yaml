# name:                                 项目名称
# owner:                                项目owner
# repo:                                 项目repo
# project_type:                         项目类型（官网：portal，文档站website：docs-website，纯文档存档：docs）
# repo_url:                             项目git地址
# branch:                               主分支
# framework:                            构建框架
# build_dir:                            构建产物目录
# skip_check:                           跳过的检查项
# accessible_routes:                    页面路由
#   - /zh/**/*
#   - /en/**/*
# ignore_routes:                        跳过检查的页面路由
#   - /(zh|en)/(other/)?(blog|news)
# build_script:                         package.json构建脚本
# seo_config_dir:                       geo/seo元数据配置目录
#   tdk: .geo/tdks
#   schema: .geo/jsonld
# home:                                 首页地址
#   - https://www.openeuler.org/
#   - https://www.openeuler.openatom.cn


# skip_check取值：
# all:                       跳过所有
# robots-txt:                robots.txt 不存在、全站封禁爬虫或未声明 Sitemap
# sitemap-access:            sitemap 无法访问或无有效内容
# sitemap-tdk:               sitemap条目缺少TDK配置文件
# sitemap-schema:            sitemap条目缺少Schema配置文件
# url-access:                URL无法访问
# llms-txt:                  llms.txt/llms-full.txt缺失或为空
# sitemap-coverage:          构建页面未被sitemap收录
# ssr-rendering:             页面疑似客户端渲染(CSR)，不利于SEO/GEO
# tdk-schema-semantic:       TDK/Schema 语义不一致，内容与页面实际内容不符

projects:
  - name: openEuler
    owner: openeuler
    repo: openEuler-portal
    project_type: portal
    repo_url: https://gitcode.com/openeuler/openEuler-portal.git
    branch: master
    framework: VitePress
    build_dir: app/.vitepress/dist
    accessible_routes:
      - /zh/**/*
      - /en/**/*
    ignore_routes:
      - /(zh|en)/(other/)?(blog|news)
    build_script: build:geo
    seo_config_dir:
      tdk: .geo/tdks
      schema: .geo/jsonld
    home:
      - https://www.openeuler.org/
      - https://www.openeuler.openatom.cn/
  - name: openEuler-docs
    owner: openeuler
    repo: docs
    project_type: docs
    repo_url: https://gitcode.com/openeuler/docs.git
    branch: master
    framework: VitePress
    skip_check:
      - all
  - name: openEuler-docs-website
    owner: openeuler
    repo: docs-website
    project_type: docs-website
    repo_url: https://gitcode.com/openeuler/docs-website.git
    branch: master
    framework: VitePress
    build_dir: app/.vitepress/dist
    skip_check:
      - sitemap-tdk
      - sitemap-schema
      - sitemap-coverage
      - sitemap-priority
    home:
      - https://docs.openeuler.org/
      - https://docs.openeuler.openatom.cn/
  - name: openGauss
    owner: opengauss
    repo: website
    project_type: portal
    repo_url: https://gitcode.com/opengauss/website.git
    branch: v2
    framework: VitePress
    build_dir: app/.vitepress/dist
    accessible_routes:
      - /zh/**/*
      - /en/**/*
    ignore_routes:
      - /(zh|en)/(blogs|search|notification)
      - /en/user-practice
    build_script: build
    seo_config_dir:
      tdk: .geo/tdks
      schema: .geo/jsonld
    home:
      - https://opengauss.org/
  - name: openGauss-docs-website
    owner: opengauss
    repo: docs-website
    project_type: docs-website
    repo_url: https://gitcode.com/opengauss/docs-website.git
    branch: v2
    framework: VitePress
    build_dir: app/.vitepress/dist
    skip_check:
      - sitemap-tdk
      - sitemap-schema
      - sitemap-coverage
      - sitemap-priority
    home:
      - https://docs.opengauss.org/
  - name: openGauss-docs
    owner: opengauss
    repo: docs
    project_type: docs
    repo_url: https://gitcode.com/opengauss/docs.git
    branch: v2
    framework: VitePress
    skip_check:
      - all
  - name: MindSpore
    owner: mindspore
    repo: mindspore-portal
    repo_url: https://gitcode.com/mindspore/mindspore-portal.git
    project_type: portal
    branch: master
    framework: Nuxt
    build_dir: packages/website/.output/public
    build_script: generate:geo
    accessible_routes:
      - /
    ignore_routes:
      - /?(technology-blogs|search|online-showroom)/?(zh|en)
      - /docs/
    seo_config_dir:
      tdk: .geo/tdk
      schema: .geo/jsonld
    home:
      - https://www.mindspore.cn/
  - name: openUBMC
    owner: openUBMC
    repo: website
    repo_url: https://gitcode.com/openUBMC/website.git
    project_type: portal
    branch: main
    framework: Nuxt
    build_dir: packages/website/.output/public
    build_script: generate
    accessible_routes:
      - /
    ignore_routes:
      - /(zh|en)/(blogs|marketplace)/?
      - /docs
    seo_config_dir:
      tdk: .geo/tdk
      schema: .geo/jsonld
    home:
      - https://www.openubmc.cn/
  - name: HiFloat
    owner: hifloat
    repo: hifloat-portal
    repo_url: https://gitcode.com/hifloat/hifloat-portal
    project_type: portal
    branch: main
    framework: Nuxt
    build_dir: .output/public
    build_script: generate
    accessible_routes:
      - /
    ignore_routes:
      - /?(technology-blogs|search|online-showroom)/?(zh|en)
    seo_config_dir:
      tdk: .geo/tdk
      schema: .geo/jsonld
    home:
      - https://hifloat.gccorg.com/
